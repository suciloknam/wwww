# Rate limit per client IP: 10 req/min with a small burst. Protects your API bill.
limit_req_zone $binary_remote_addr zone=llm:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 256k;      # logs bigger than this get rejected before costing tokens
    server_tokens off;

    location = /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        auth_basic           "LogLens";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=llm burst=5 nodelay;
        limit_req_status 429;

        proxy_pass         http://api:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 75s;     # primary (30s) + fallback (30s) + headroom
    }
}
