services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    expose: ["8000"]            # NOT published to the host — only nginx can reach it
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80"]
    volumes:
      - ./nginx/loglens.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
